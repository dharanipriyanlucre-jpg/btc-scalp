name: Delta Backtest

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (Required for pandas_ta)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backtest
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
          DELTA_SYMBOL: ${{ secrets.DELTA_SYMBOL }}
          START_DATE: ${{ secrets.START_DATE }}
          END_DATE: ${{ secrets.END_DATE }}
        run: |
          python backtest.py
          
