name: Backtest

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install pandas numpy requests

      - name: Run backtest
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python backtest.py
