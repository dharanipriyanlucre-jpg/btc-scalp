name: Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history"
        default: "30"
      timeframe:
        description: "Candle timeframe"
        type: choice
        default: "5m"
        options: ["1m", "3m", "5m", "15m", "30m", "1h"]
      symbol:
        description: "Delta Exchange symbol"
        default: "BTCUSD"
      fee_pct:
        description: "Fee per side in % (taker)"
        default: "0.05"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Run backtest
        env:
          DAYS: ${{ inputs.days || '30' }}
          TIMEFRAME: ${{ inputs.timeframe || '5m' }}
          SYMBOL: ${{ inputs.symbol || 'BTCUSD' }}
          FEE_PCT: ${{ inputs.fee_pct || '0.05' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          COINALYZE_KEY: ${{ secrets.COINALYZE_KEY }}
        run: python backtest.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: results/
